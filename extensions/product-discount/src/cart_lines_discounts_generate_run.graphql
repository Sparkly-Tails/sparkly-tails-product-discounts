query Input {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  shop {
    metafield(namespace: "$app:smooth_discount", key: "tier_config") {
      jsonValue
    }
  }
  discount {
    discountClasses
  }
}
